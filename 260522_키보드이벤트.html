<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>키보드 이벤트</title>
</head>
<style>
    section{
        display: inline-block;
        width: 300px;
        height: 300px;
        background-color: lightgray;
        border: 1px solid black;
    }
</style>
<body>
<textarea></textarea>

<section></section>
<section></section>
<section></section>
<section></section>
</body>
</html>
<script>
    // 문제. asdf 각 키를 눌렀을 때, 키에 맞는 색상을 자신이 정해서,
    // 각 section의 배경색을 변경하세요.
    // 예시) a를 누르면 첫번째 section의 색이 빨강이 됩니다.
    // 단, 어떤 키를 눌렀을 때,  해당 박스의 색만 변경되어야하고,
    // 나머지 박스는 색이 초기화되어야 합니다.
    window.onkeydown = (event) => {
        console.log('keydown');
        let key = event.key
        console.log(`눌린 key: ${key}`);
        if (key === 'a') {
            sec1.style.backgroundColor = 'red';
            sec2.style.backgroundColor = 'grey';
            sec3.style.backgroundColor = 'grey';
            sec4.style.backgroundColor = 'grey';
        }
        if (key === 's') {
            sec1.style.backgroundColor = 'grey';
            sec2.style.backgroundColor = 'blue';
            sec3.style.backgroundColor = 'grey';
            sec4.style.backgroundColor = 'grey';
        }
        if (key === 'd') {
            sec1.style.backgroundColor = 'grey';
            sec2.style.backgroundColor = 'grey';
            sec3.style.backgroundColor = 'yellow';
            sec4.style.backgroundColor = 'grey';
        }
        if (key === 'f') {
            sec1.style.backgroundColor = 'grey';
            sec2.style.backgroundColor = 'grey';
            sec3.style.backgroundColor = 'grey';
            sec4.style.backgroundColor = 'green';
        }
    }

    let sec = document.querySelectorAll('section');
    let sec1 = sec[0];
    let sec2 = sec[1];
    let sec3 = sec[2];
    let sec4 = sec[3];

    let textarea = document.querySelector('textarea');
    textarea.onkeydown = (event) => {
        console.log('keydown');
        let key = event.key;
        console.log(`눌린 key: ${key}`);
    }
    textarea.onkeyup = () => {
        console.log('keyup')
    }
    // input 요소(input, textarea)에 value 가 변경되면 실행
    // 데이터를 입력했거나, 체크박스 체크를 했거나.. 등등
    textarea.oninput = () => {
        let text = textarea.value; // 작성된 문자를 가져옴
        console.log(text.length); // 문자의 길이는?
    }


</script>
