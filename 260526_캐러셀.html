<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>캐러셀</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        list-style: none;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container{
        position: relative;
        width: 1000px;
        height: 600px;
        background-color: greenyellow;
        overflow: hidden;
    }
    .carousel{
        display: inline-flex;
        flex-wrap: nowrap;
        flex-shrink: 0;
        height: 100%;
        background-color: darkblue;
        cursor: pointer;
        transition-duration: 1s;
        /*transform: translateX(-2000px);*/
    }
    .carousel > .slide{
        width: 1000px;
        border: 1px solid black;
        background-color: lightgray;
    }
    img{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .slide{
        position: relative;
    }
    .slide > div{
        position: absolute;
        width: 70%;
        left: 10px;
        bottom: 10px;
        background-color: rgba(0,0,0,0.4);
        color: white;
        font-size: 50px;
    }
    .button_container{
        display: flex;
        position: absolute;
        padding: 0 20px;
        width: 100%;
        height: 100%;
        top: 0;
        justify-content: space-between;
        align-items: center;
    }
    .button_container > button{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 50px;
        height: 50px;
        font-size: 30px;
        border-radius: 50%;
        background-color: black;
        color: white;
        z-index: 99;
        cursor: pointer;
    }
</style>
<body>
<section class="container">
    <div class="button_container">
        <button type="button">⬅</button>
        <button type="button">➡</button>
    </div>

    <ul class="carousel">
        <li class="slide">
            <div>
                <h2>TITLE1</h2>
                <p>이건 파이리와 꼬부기의 싸움이다</p>
            </div>
            <img src="https://blog.kakaocdn.net/dna/tYmJ8/btqCn0Cvwne/AAAAAAAAAAAAAAAAAAAAAADz-F2RyvcKHR-D962utz_-bhd0r71fnv70i1-FCtBl/img.png?credential=yqXZFxpELC7KVnFOS48ylbz2pIh7yKj8&expires=1780239599&allow_ip=&allow_referer=&signature=ocnFJDGv1HGVtZfqQdddrDIfmJs%3D" alt="">
        </li>
        <li class="slide">
            <div>
                <h2>TITLE2</h2>
                <p>리자드 진화</p>
            </div>
            <img src="https://mblogthumb-phinf.pstatic.net/MjAxOTAxMTFfNDgg/MDAxNTQ3MTg4MzU1ODU4.eEGkSQ6lQcU5dHXP9Q3yEjyM3KfqHxWQQynx1a2bvK0g.BVjSnyufz2kSAGxv58mo7JADKH1RZF60LetbaJ0ujtMg.JPEG.jurong25/20190111_152654.jpg?type=w800" alt="">
        </li>
        <li class="slide">
            <div>
                <h2>TITLE3</h2>
                <p>리자몽 최종 진화</p>
            </div>
            <img src="https://i.namu.wiki/i/zEByLPgRtZ8wSwaXY9-cbZDCM_2k-SHm0N1nU8GfMYdxQ5GuvO8DZmrv-aHtMYcY8P-2obdb345KexwJWgGnFg.webp" alt="">
        </li>
    </ul>
</section>



</body>
</html>
<script>
    const carousel = document.querySelector('.carousel');
    const [leftBtn, rightBtn] = document.querySelectorAll('.button_container > button');
    document.querySelectorAll('.slide img').forEach(img => {
        img.draggable = false;
    })


    let movedX = 0;
    leftBtn.onclick = () => {
        // if(movedX > 0){
        // }
        let slides = document.querySelectorAll('.slide');
        let lastSlide = slides[slides.length - 1];
        carousel.appendChild(lastSlide);

        movedX = movedX + 1000;
        carousel.style.transform = `translateX(${movedX}px)`;
    }
    rightBtn.onclick = () => {
        // if(movedX > -2000){
        // }
        movedX = movedX - 1000;
        carousel.style.transform = `translateX(${movedX}px)`;
    }



</script>
